name: Weekly Maintenance

# 週次のドリフト検査。PR が無い週でも main の品質ゲートと依存の脆弱性を確認する。
on:
  schedule:
    - cron: '0 21 * * 0' # 月曜 06:00 JST
  workflow_dispatch:

jobs:
  quality-gates:
    name: Quality Gates (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # ci.yml の audit ジョブと同理由（npm legacy audit API 410 廃止 → pnpm 11 で監査。
    # COREPACK_ENABLE_STRICT=0 で packageManager=pnpm@10 への強制切替を無効化）
    env:
      COREPACK_ENABLE_STRICT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit（high 以上で失敗）
        run: |
          set -euo pipefail
          VERSION="$(pnpm dlx --config.minimumReleaseAge=0 pnpm@11.13.0 --config.manage-package-manager-versions=false --version)"
          echo "audit pnpm version: ${VERSION}"
          case "${VERSION}" in
            11.*) ;;
            *)
              echo "Expected pnpm 11.x for audit, got ${VERSION}" >&2
              exit 1
              ;;
          esac
          pnpm dlx --config.minimumReleaseAge=0 pnpm@11.13.0 --config.manage-package-manager-versions=false audit --audit-level=high
      - name: pnpm outdated（情報提供のみ）
        if: always()
        run: pnpm outdated --recursive || true
