name: Weekly Maintenance

# 週次のドリフト検査。PR が無い週でも main の品質ゲートと依存の脆弱性を確認する。
on:
  schedule:
    - cron: '0 21 * * 0' # 月曜 06:00 JST
  workflow_dispatch:

jobs:
  quality-gates:
    name: Quality Gates (main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:harness
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ci.yml の audit ジョブと同理由（npm legacy audit API 410 廃止 → pnpm 11 で監査）
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Switch to pnpm 11 for audit (runner only)
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.packageManager = 'pnpm@11.13.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          VERSION="$(pnpm --version)"
          echo "audit pnpm version: ${VERSION}"
          case "${VERSION}" in
            11.*) ;;
            *)
              echo "Expected pnpm 11.x for audit, got ${VERSION}" >&2
              exit 1
              ;;
          esac
      - name: pnpm audit（high 以上で失敗）
        run: pnpm audit --audit-level=high
      - name: pnpm outdated（情報提供のみ）
        if: always()
        run: pnpm outdated --recursive || true
