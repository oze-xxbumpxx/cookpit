name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 品質ゲートを 1 ジョブに集約する。GitHub Actions はジョブ単位で分単位に切り上げ課金され、
  # かつ各ジョブが checkout + pnpm install（約 20 秒）を繰り返すため、分割していると
  # run あたり 2.5 分ほどが重複セットアップに消えていた。
  #
  # ステップは「安い順」に並べる。失敗すると後続はスキップされるため、lint の失敗で
  # build / test の分を払わずに済む。
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    # 通常 5〜12 分程度（install + lint + type-check + build + test + audit）。
    # ハングや暴走を打ち切るための上限で、通常実行を切らない余裕を持たせている。
    timeout-minutes: 30
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 変更範囲の判定に base との差分が要るため全履歴を取る
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: 変更範囲を判定
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # main への push は常に全ゲートを実行する（main は常にフル検証された状態に保つ）
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "event=${EVENT_NAME}: 全ゲートを実行します"
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "deps_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}" HEAD)"
          echo "変更ファイル:"
          printf '%s\n' "${changed}" | sed 's/^/  - /'

          # ドキュメント・ログ・メモとルート直下の Markdown のみなら、コードは変わっていない。
          # .claude/ 配下は Hook / Script を含むため、あえて「コード扱い」にして全ゲートを回す。
          # docs/ logs/ notes/ 配下は前方一致、ルート直下の Markdown は完全一致で判定する
          # （apps/web/README.md のような配下の md は「コード扱い」にして全ゲートを回す）。
          if printf '%s\n' "${changed}" | grep -qvE '^(docs/|logs/|notes/)|^[^/]*\.md$'; then
            docs_only=false
          else
            docs_only=true
          fi

          # 依存監査は依存定義が変わったときだけ実行する。依存を変えていない変更に対する
          # 新規アドバイザリの検知は weekly-maintenance.yml（週次・main）が担う。
          if printf '%s\n' "${changed}" | grep -qE '(^|/)(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$'; then
            deps_changed=true
          else
            deps_changed=false
          fi

          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "deps_changed=${deps_changed}" >> "${GITHUB_OUTPUT}"

      # ハーネスの安全境界（承認検証・状態永続化・保護対象判定・E2E 判定）の回帰テスト。
      # ローカル Hook を回避（--no-verify / LEFTHOOK=0）してもここは必ず実行されるため、
      # 保護機構を骨抜きにする変更はサーバ側で検出される。docs のみの変更でも実行する
      # （数秒で終わる・Node 標準ランナーのみで追加依存なし）。
      - name: Harness tests
        run: pnpm test:harness

      # format:check は Markdown も対象のため、ドキュメントだけの変更でも必ず実行する
      - name: Format check
        run: pnpm format:check

      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm lint

      - name: Type check
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm type-check

      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm build

      - name: Test
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test

      # --- 以下は依存監査。packageManager を書き換えるため必ずジョブの最後に置く ---
      # npm が legacy audit API を 410 廃止したため、bulk advisory 対応の pnpm 11 で監査する
      # （pnpm/pnpm#11265）。pnpm 11 は Node >= 22.13 が必要なため、ここだけ Node を上げる
      # （.nvmrc は 20 のまま。リポジトリ本体の packageManager / .nvmrc は据え置き）。
      - name: Set up Node 22 for audit (runner only)
        if: steps.scope.outputs.deps_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Switch to pnpm 11 for audit (runner only)
        if: steps.scope.outputs.deps_changed == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.packageManager = 'pnpm@11.13.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          VERSION="$(pnpm --version)"
          echo "audit pnpm version: ${VERSION}"
          case "${VERSION}" in
            11.*) ;;
            *)
              echo "Expected pnpm 11.x for audit, got ${VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Audit production dependencies (blocking, high+)
        # devDependency の脆弱性（例: happy-dom GHSA-37j7-fg3j-429f）は本番非影響のため
        # ここでは落とさない。解消不能な推移的脆弱性が出た場合の除外は
        # package.json の pnpm.auditConfig.ignoreGhsas を使う
        if: steps.scope.outputs.deps_changed == 'true'
        run: pnpm audit --prod --audit-level=high

      - name: Audit all dependencies (informational, critical+)
        if: always() && steps.scope.outputs.deps_changed == 'true'
        continue-on-error: true
        run: pnpm audit --audit-level=critical

      - name: 実行範囲のサマリ
        if: always()
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
          DEPS_CHANGED: ${{ steps.scope.outputs.deps_changed }}
        run: |
          {
            echo "### CI 実行範囲"
            echo ""
            echo "| 判定 | 値 |"
            echo "| --- | --- |"
            echo "| ドキュメントのみの変更 | ${DOCS_ONLY:-unknown} |"
            echo "| 依存定義の変更 | ${DEPS_CHANGED:-unknown} |"
            echo ""
            if [ "${DOCS_ONLY:-}" = "true" ]; then
              echo "ドキュメントのみの変更のため lint / type-check / build / test / E2E をスキップしました。"
              echo "Markdown も対象の \`format:check\` は実行しています。"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  e2e:
    name: E2E Smoke
    # PR 時のみ実行。ドキュメントのみの変更では画面もサーバーも変わらないためジョブごとスキップする。
    #
    # 「未実行」を「成功」として扱わない（旧実装は DATABASE_URL secret が無いと全 step を
    # スキップしたうえでジョブが success になっていた）。
    # - secret があれば従来どおり実 DB（Neon）で実行する。
    # - secret が無ければ PGlite（apps/web/scripts/setup-pglite-dev.mjs）で**実際に実行する**。
    # - どちらの経路でも最後に assert-e2e-results.mjs が「2 件以上実行され全件成功」を検証する。
    #   テスト 0 件・全件 skip・レポート欠落（＝ランナー未起動）はすべて失敗になる。
    needs: quality
    if: github.event_name == 'pull_request' && needs.quality.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # 通常 5〜15 分程度（install + browser install + dev サーバー起動 + smoke 2 本）。
    timeout-minutes: 30
    env:
      # Playwright の JSON レポート出力先（apps/web からの相対）
      PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: DB 経路を決定
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "secret あり: 実 DB（Neon）で E2E を実行します"
            echo "mode=neon" >> "${GITHUB_OUTPUT}"
          else
            echo "secret なし: PGlite で E2E を実行します（スキップしません）"
            echo "mode=pglite" >> "${GITHUB_OUTPUT}"
          fi

      - name: Apply DB migrations (Neon)
        # スキーマドリフト対策（例: 0004_add_recipe_servings 未適用で /recipes が 500）。
        # drizzle-kit migrate は適用済み分をスキップするため冪等
        if: steps.db.outputs.mode == 'neon'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @cookpit/web db:migrate

      - name: Seed PGlite database
        # 実マイグレーション適用 + 最小シード。冪等（ON CONFLICT DO NOTHING）
        if: steps.db.outputs.mode == 'pglite'
        run: pnpm --filter @cookpit/web db:seed:pglite

      - name: Install Playwright Chromium
        run: pnpm --filter @cookpit/web exec playwright install --with-deps chromium

      - name: Run E2E smoke
        env:
          DATABASE_URL: ${{ steps.db.outputs.mode == 'neon' && secrets.DATABASE_URL || 'pglite://.pglite-dev' }}
        run: pnpm --filter @cookpit/web exec playwright test --reporter=list,json

      - name: E2E が実際に実行されたことを検証
        # 前の step が落ちても必ず実行し、「未実行のまま緑」を構造的に不可能にする
        if: always()
        run: node .claude/scripts/assert-e2e-results.mjs apps/web/e2e-report.json --min-tests 2

      - name: E2E 実行経路のサマリ
        if: always()
        env:
          DB_MODE: ${{ steps.db.outputs.mode }}
        run: |
          {
            echo "### E2E 実行経路"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| DB 経路 | ${DB_MODE:-unknown} |"
            echo ""
            echo "未実行・テスト0件・全件 skip はいずれも失敗として扱われます。"
          } >> "${GITHUB_STEP_SUMMARY}"
