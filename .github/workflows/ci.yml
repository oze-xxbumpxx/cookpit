name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm type-check

  build:
    name: Build
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e:
    name: E2E Smoke
    # PR 時のみ実行。smoke は自己完結型 CRUD だが実 DB（DATABASE_URL）に書き込むため、
    # secret 未設定なら明示的にスキップする。専用の Neon ブランチ DB の利用を推奨。
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Skip (DATABASE_URL secret not configured)
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL が未設定のため E2E smoke をスキップします"
      - name: Apply DB migrations
        # スキーマドリフト対策（例: 0004_add_recipe_servings 未適用で /recipes が 500）。
        # drizzle-kit migrate は適用済み分をスキップするため冪等
        if: env.DATABASE_URL != ''
        run: pnpm --filter @cookpit/web db:migrate
      - name: Install Playwright Chromium
        if: env.DATABASE_URL != ''
        run: pnpm --filter @cookpit/web exec playwright install --with-deps chromium
      - name: Run E2E smoke
        if: env.DATABASE_URL != ''
        run: pnpm --filter @cookpit/web e2e

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # npm が legacy audit API を 410 廃止したため、bulk advisory 対応の pnpm 11 で監査する
    # （pnpm/pnpm#11265）。pnpm 11 は Node >= 22.13 が必要。
    # package.json の packageManager=pnpm@10 だと dlx / Corepack 経由でも実行時に 10 へ戻り
    # 旧 API で 410 になるため、監査中だけ packageManager を pnpm 11 に差し替える
    # （ランナー上のみ。リポジトリ本体の packageManager / .nvmrc は据え置き）。
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Switch to pnpm 11 for audit (runner only)
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.packageManager = 'pnpm@11.13.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          VERSION="$(pnpm --version)"
          echo "audit pnpm version: ${VERSION}"
          case "${VERSION}" in
            11.*) ;;
            *)
              echo "Expected pnpm 11.x for audit, got ${VERSION}" >&2
              exit 1
              ;;
          esac
      - name: Audit production dependencies (blocking, high+)
        # devDependency の脆弱性（例: happy-dom GHSA-37j7-fg3j-429f）は本番非影響のため
        # ここでは落とさない。解消不能な推移的脆弱性が出た場合の除外は
        # package.json の pnpm.auditConfig.ignoreGhsas を使う
        run: pnpm audit --prod --audit-level=high
      - name: Audit all dependencies (informational, critical+)
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level=critical
