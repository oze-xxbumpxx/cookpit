# Git hooks（lefthook）。pnpm install 時に prepare スクリプトで自動インストールされる。
# 品質ゲートを CI 到達前（コミット/プッシュ時）に前倒しする。
pre-commit:
  parallel: false
  commands:
    # main への直コミット防止（作業ブランチ運用の機械的担保。
    # orchestration-policy.md §実装ルートの分岐。意図的な例外は LEFTHOOK=0 で明示的に外す）
    branch-guard:
      priority: 1
      run: |
        branch="$(git symbolic-ref --short HEAD 2>/dev/null || echo detached)"
        if [ "$branch" = "main" ]; then
          echo "✗ main への直コミットは禁止です。作業ブランチを作成してください。" >&2
          echo "  （docs/claude-code/orchestration-policy.md §実装ルートの分岐）" >&2
          exit 1
        fi
    format:
      glob: '*.{ts,tsx,md,json,mjs,cjs,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      # turbo キャッシュにより未変更パッケージはスキップされるため全体 lint で十分速い
      run: pnpm lint

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    type-check:
      run: pnpm type-check
