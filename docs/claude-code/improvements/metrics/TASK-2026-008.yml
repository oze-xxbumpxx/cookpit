# Codex 委譲ルートのタスクのみ記入（Orchestrator ルートは unknown のまま）。
# IMP-2026-025 の効果実測をモデル条件込みで比較するための記録（2026-07-18 追加）。
codex:
  model: unknown # 例: gpt-5-codex（実際に使ったモデル。ブリーフ README の確定値表と一致させる）
  reasoning_effort: unknown # 例: low | medium | high（Task/層で変えた場合は notes に内訳）
  notes: ''

quality:
  tests_added: 0 # 設定ファイルの再編のため自動試験の追加対象なし（検証は機械照合）
  initial_test_failures: 0
  reviewer_critical: 1 # M-1: 要件 F-7 が部分充足のまま完了と報告しかけた（自己レビューで検出・修正済み）
  reviewer_major: 3 # S-1〜S-3（申し送り）
  reviewer_minor: 2 # N-1〜N-2
  user_corrections: 0
  escaped_defects: 0

process:
  requirement_rework: 1 # 実装中に R-3 の対象範囲を拡張（COOKPIT_GAP_CAP_MIN 相当の発見はせず、出典の母集団定義を修正）
  design_rework: 2 # 層割り当ての訂正 2 件（check-review-coverage / record-activity・estimate-session-time）
  implementation_rework: 1 # 出典書き換えの取りこぼし 7 箇所をレビュー後に修正
  missing_documents: 0 # docs/reviews/ を後から作成して充足（自動補完時は 1 だった）
  unresolved_items: 3 # S-1（Cookpit 固有ドキュメント参照）/ S-2（core 単独の未実証）/ S-3（settings.json と Hook 配線）
  # セッション時間に占めるメタ作業（改善サイクル・棚卸し・承認待ち・ハーネス議論）の割合。
  # 0.0〜1.0 または unknown。個人開発ライトモードの肥大監視用（IMP-2026-030）。
  meta_work_ratio: unknown

machine:
  # collect-task-metrics.mjs による自動集計。手で編集しない（--write の再実行で更新）
  collected_at: 2026-07-31
  branch_filters: ['harness-plugin-split']
  sessions: # session_id 単位でマージ・累積（1 行 = 1 セッション）
    []
  gate_history: # run-quality-gates.sh の実行記録（ts 単位でマージ・累積）
    []
  totals:
    sessions: 0
    active_minutes: 0 # 約0分（活動時間ベース・空白30分超は除外）
    tokens_input: 0
    tokens_output: 0
    tokens_cache_creation: 0
    tokens_cache_read: 0
    tokens_total: 0
    tool_uses: 0
    user_prompts: 0
    agent_calls: 0
    agent_calls_by_type: {}
    agent_restarts: 0 # 同一 Subagent 種の再起動数（手戻りプロキシ）
    gate_runs: 0
    gate_fail_runs: 0
    gate_rework_rate: unknown # ゲート実行記録なし
# 任意: before/after や IMP 定量比較でフェーズを分けたいときだけ埋める。
# 機械自動では埋めない。不明な欄は unknown のまま。
phases:
