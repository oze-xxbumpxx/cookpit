    agent_restarts: 0 # 同一 Subagent 種の再起動数（手戻りプロキシ）
    gate_runs: 1
    gate_fail_runs: 1
    gate_rework_rate: 1 # FAIL を含む実行 / 総実行（手戻りプロキシ）
