# Codex 委譲ルートのタスクのみ記入（Orchestrator ルートは unknown のまま）。
# IMP-2026-025 の効果実測をモデル条件込みで比較するための記録（2026-07-18 追加）。
codex:
  model: unknown # 例: gpt-5-codex（実際に使ったモデル。ブリーフ README の確定値表と一致させる）
  reasoning_effort: unknown # 例: low | medium | high（Task/層で変えた場合は notes に内訳）
  notes: ''

quality:
  tests_added: unknown # 追加テスト件数。取得できなければ unknown（Vitest 全層導入済み）
  initial_test_failures: unknown
  reviewer_block_open: 0 # B-01（format:check FAIL）は pnpm format で解消済み
  reviewer_high_impact_unverified: 0
  reviewer_follow_up_open: 0 # F-01（JSDoc 日本語化）・F-02（docs/reviews handoff）ともに解消済み
  reviewer_pre_existing: 0
  # 旧 severity の時系列比較用。新規 review では impact 別件数として記録し、不明なら unknown。
  reviewer_critical: unknown
  reviewer_major: unknown # high impact の互換欄
  reviewer_minor: unknown # medium / low impact の互換欄
  user_corrections: 0
  escaped_defects: 0

process:
  requirement_rework: 0
  design_rework: 0
  implementation_rework: 1 # format BLOCK (B-01) の 1 往復
  missing_documents: 0
  unresolved_items: 1 # 設計書「2026-02-30 は Invalid Date」記述の事後訂正が未反映
  # セッション時間に占めるメタ作業（改善サイクル・棚卸し・承認待ち・ハーネス議論）の割合。
  # 0.0〜1.0 または unknown。個人開発ライトモードの肥大監視用（IMP-2026-030）。
  meta_work_ratio: unknown

# 人間レビューの負荷を測る。秒単位の計時や長いアンケートは要求しない。
# active_time_bucket / confidence / full_diff_opened だけ人間が任意で回答し、その他は
# review packet / audit から取得できる場合に記録する。不明なら推測せず unknown。
review:
  active_time_bucket: unknown # lt5m | 5to15m | 15to30m | gt30m
  confidence: unknown # 1〜5（変更を理解してマージ判断できる確信度）
  full_diff_opened: unknown # true | false
  handoff_items: unknown
  rounds: 1 # B-01 の format 修正で 1 往復
  stale_invalidations: unknown
  verified_findings: 3 # B-01 / F-01 / F-02（すべて実際の対応につながった）
  false_positive_findings: 0

machine:
